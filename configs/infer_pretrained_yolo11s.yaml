mode: pretrained_yolo11s
model_type: yolo11s
model_weights: yolo11s.onnx
classes: [person, bicycle, car, motorcycle, bus, truck]  # COCO names to keep; use [] or `--classes all` for all 80
run_name: pretrained_yolo11s_demo
report_path: reports/pretrained_yolo11s_demo_summary.json
alerts_root: alerts
runtime:
  approx_fps: 25
  score_threshold: 0.35
  iou_threshold: 0.5
  clip_seconds_before: 3
  max_frames: 0
tracking:
  tracker: bytetrack.yaml
  detector_conf: 0.1  # tracker sees boxes >= this (feeds ByteTrack's 2nd pass); drawing/events use runtime.score_threshold
  stopped_vehicle_motion_threshold_px: 6.0
  stopped_vehicle_dwell_seconds: 15
rules:
  stopped_vehicle:
    motion_threshold_px: 6.0
    dwell_seconds: 15
    cooldown_seconds: 180
  crowding:
    min_count: 12
    confirm_window_frames: 5
    min_confirm_frames: 3
    cooldown_seconds: 90
streams:
  - camera_id: demo_cam_01
    uri: rtsp://127.0.0.1:8554/live
