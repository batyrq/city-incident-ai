    task_type: detection
    access_mode: manual_download
    can_auto_download: false
    enabled: true
    adapter: fasdd
    raw_root: datasets/raw/fasdd
    target_interim_layout: datasets/interim/fasdd
    expected_raw_layout:
      - train/
      - val/
    label_mapping_supported: true
    notes: "Manual download expected."
