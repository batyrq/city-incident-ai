datasets:
  - dataset_name: dfire
    task_type: detection
    access_mode: manual_download
    can_auto_download: false
    enabled: true
    adapter: dfire
    raw_root: datasets/raw/dfire
    target_interim_layout: datasets/interim/dfire
    expected_raw_layout:
      - images/
      - labels/
    label_mapping_supported: true
    notes: "Common public source, but hosting can vary. Keep as manual adapter unless a stable mirror is available."
