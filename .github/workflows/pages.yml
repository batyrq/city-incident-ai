# Publishes the committed static site (site/) to GitHub Pages.
# Manual only (Actions tab -> "Publish site to GitHub Pages" -> Run workflow, pick branch interview-prep).
# Pages must be enabled first: Settings -> Pages -> Source: GitHub Actions. See README "Website".
name: Publish site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
