[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "city-incident-ai"
version = "0.1.0"
description = "Production-minded local CV/MLOps scaffold for city incident surveillance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "opencv-python>=4.9",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3.0"]
anomalib = ["anomalib>=1.1.0", "torch>=2.2", "lightning>=2.2"]
tracking = ["supervision>=0.22"]
sam2 = ["sam2 @ git+https://github.com/facebookresearch/sam2.git"]
dev = ["pytest>=8.2"]

[tool.setuptools]
py-modules = []
